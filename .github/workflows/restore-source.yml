name: Restore PRI-ANIME source bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconstruct project files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [p for p in Path('.').glob('*.txt') if 'Full App Source' in p.name]
          if not candidates:
              raise SystemExit('Could not find the PRI-ANIME Full App Source.txt bundle')
          source = max(candidates, key=lambda p: p.stat().st_size).read_text(encoding='utf-8')
          marker = re.compile(r'^FILE:\s+(.+?)\s*\n={10,}\s*\n', re.MULTILINE)
          matches = list(marker.finditer(source))
          if len(matches) < 100:
              raise SystemExit(f'Bundle looks incomplete: found only {len(matches)} file sections')
          restored = 0
          for i, match in enumerate(matches):
              rel = match.group(1).strip().removeprefix('PRI-ANIME/')
              if not rel or rel.startswith('/') or '..' in Path(rel).parts:
                  raise SystemExit(f'Unsafe path in bundle: {rel!r}')
              if any(part in {'.git', 'node_modules', 'dist'} for part in Path(rel).parts):
                  continue
              if re.match(r'(^|/)\.env($|\.)', rel, re.IGNORECASE):
                  continue
              end = matches[i + 1].start() if i + 1 < len(matches) else len(source)
              body = source[match.end():end].rstrip('\n')
              target = Path(rel)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(body + '\n', encoding='utf-8')
              restored += 1
          print(f'Restored {restored} source files from {len(matches)} sections.')
          PY

      - name: Commit reconstructed project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No reconstructed changes to commit."
          else
            git commit -m "Restore PRI-ANIME application source"
            git push
          fi
